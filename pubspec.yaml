name: visitor_guard_app
description: "Security Guard Mobile App for Visitor Entry, Returning Visitor Lookup, and Camera Match Alerts"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  google_fonts: ^6.3.2
  heroicons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
